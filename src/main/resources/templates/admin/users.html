<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/layout :: layout(~{::title}, ~{::breadcrumb}, ~{::content}, ~{::head-extra}, ~{::scripts})}">
    <title th:fragment="title">Quản lý người dùng</title>
    <th:block th:fragment="head-extra"></th:block>
    <th:block th:fragment="breadcrumb">
        <nav aria-label="breadcrumb"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Người dùng</li>
        </ol></nav>
    </th:block>

    <th:block th:fragment="content" th:with="currentPage='users'">
        <div class="page-header">
            <div class="page-title"><i class="bi bi-people"></i> Quản lý người dùng</div>
        </div>

        <div class="table-wrapper">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Họ tên</th>
                        <th>Tài khoản</th>
                        <th>Email</th>
                        <th>Quyền</th>
                        <th>Trạng thái</th>
                        <th>Ngày tạo</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u, stat : ${users}">
                        <td style="color:#9ca3af;" th:text="${stat.index + 1}"></td>
                        <td style="font-weight:600;" th:text="${u.fullName}"></td>
                        <td>
                            <code style="background:#f3f4f6;padding:2px 8px;border-radius:5px;font-size:12px;"
                                  th:text="${u.username}"></code>
                        </td>
                        <td style="font-size:13px;color:#6b7280;" th:text="${u.email ?: '-'}"></td>
                        <td>
                            <span th:class="'badge rounded-pill ' + (${u.role.name == 'ADMIN'} ? 'bg-danger' : (${u.role.name == 'MAINTENANCE'} ? 'bg-warning text-dark' : 'bg-primary'))"
                                  style="font-size:11px;" th:text="${u.role.name}"></span>
                        </td>
                        <td>
                            <span th:if="${u.isActive}"
                                  class="badge-status badge-available">Hoạt động</span>
                            <span th:unless="${u.isActive}"
                                  class="badge-status badge-broken">Đã khóa</span>
                        </td>
                        <td style="font-size:12px;color:#9ca3af;"
                            th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy')}"></td>
                        <td>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-2 me-1"
                                    title="Sửa người dùng"
                                    th:attr="data-id=${u.id},
                                             data-full-name=${u.fullName},
                                             data-username=${u.username},
                                             data-email=${u.email ?: ''},
                                             data-phone=${u.phone ?: ''},
                                             data-role-id=${u.role != null ? u.role.id : ''}"
                                    onclick="openEditUser(this)">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <form th:action="@{'/admin/users/' + ${u.id} + '/toggle'}" method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" th:class="'btn btn-sm py-1 px-2 ' + (${u.isActive} ? 'btn-outline-warning' : 'btn-outline-success')">
                                    <i th:class="${u.isActive} ? 'bi bi-lock' : 'bi bi-unlock'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </th:block>
    <th:block th:fragment="scripts">
        <div class="modal fade" id="editUserModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius:16px;">
                    <div class="modal-header" style="background:#f9fafb;border-bottom:1px solid #e5e7eb;">
                        <h5 class="modal-title">
                            <i class="bi bi-pencil-square me-2"></i>Sửa người dùng
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form id="editUserForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="modal-body">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label">Họ tên</label>
                                    <input type="text" name="fullName" id="editFullName" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Tài khoản</label>
                                    <input type="text" name="username" id="editUsername" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" name="phone" id="editPhone" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" id="editEmail" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Quyền</label>
                                    <select name="roleId" id="editRoleId" class="form-select" required>
                                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script>
            function openEditUser(button) {
                document.getElementById('editUserForm').action = '/admin/users/' + button.dataset.id + '/edit';
                document.getElementById('editFullName').value = button.dataset.fullName || '';
                document.getElementById('editUsername').value = button.dataset.username || '';
                document.getElementById('editEmail').value = button.dataset.email || '';
                document.getElementById('editPhone').value = button.dataset.phone || '';
                document.getElementById('editRoleId').value = button.dataset.roleId || '';
                new bootstrap.Modal(document.getElementById('editUserModal')).show();
            }
        </script>
    </th:block>
</th:block>
</html>
