<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/layout :: layout(~{::title}, ~{::breadcrumb}, ~{::content}, ~{::head-extra}, ~{::scripts})}">
    <title th:fragment="title">Quản lý phòng học</title>
    <th:block th:fragment="head-extra"></th:block>
    <th:block th:fragment="breadcrumb">
        <nav aria-label="breadcrumb"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Phòng học</li>
        </ol></nav>
    </th:block>

    <th:block th:fragment="content" th:with="currentPage='rooms'">
        <div class="page-header">
            <div class="page-title"><i class="bi bi-building"></i> Quản lý phòng học</div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRoomModal">
                <i class="bi bi-plus-circle me-1"></i> Thêm phòng
            </button>
        </div>

        <div class="row g-3">
            <div th:each="room : ${rooms}" class="col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div style="width:44px;height:44px;background:rgba(255,107,0,0.1);border-radius:10px;
                             display:flex;align-items:center;justify-content:center;font-size:20px;color:#FF6B00;">
                                <i class="bi bi-door-open"></i>
                            </div>
                            <div>
                                <div style="font-weight:700;font-size:15px;" th:text="${room.code}"></div>
                                <div style="font-size:12px;color:#6b7280;" th:text="${room.building ?: ''}"></div>
                            </div>
                        </div>
                        <div style="font-weight:500;font-size:14px;margin-bottom:6px;" th:text="${room.name}"></div>
                        <div style="font-size:12px;color:#9ca3af;">
                            <i class="bi bi-people me-1"></i>
                            <span th:text="${room.capacity != null ? room.capacity + ' chỗ' : 'N/A'}"></span>
                            <span th:if="${room.floor != null}">
                            &bull; Tầng <span th:text="${room.floor}"></span>
                        </span>
                        </div>
                        <div th:if="${room.code == 'STORE'}" class="mt-2">
                            <span class="badge rounded-pill bg-secondary">Phòng hệ thống</span>
                        </div>
                    </div>
                    <div class="card-body pt-0">
                        <form th:if="${room.code != 'STORE'}" th:action="@{'/admin/rooms/' + ${room.id} + '/delete'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100"
                                    onclick="return confirm('Xóa phòng này?')">
                                <i class="bi bi-trash me-1"></i> Xóa
                            </button>
                        </form>
                        <div th:if="${room.code == 'STORE'}" class="text-muted small">
                            Store Room chỉ được hệ thống sử dụng khi tạo mới hoặc checkout.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="scripts">
        <!-- Add Room Modal -->
        <div class="modal fade" id="addRoomModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius:16px;">
                    <div class="modal-header" style="border-bottom:1px solid #f3f4f6;">
                        <h5 class="modal-title fw-bold">
                            <i class="bi bi-plus-circle me-2" style="color:#FF6B00;"></i>Thêm phòng mới
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/rooms/create}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="modal-body p-4">
                            <div class="row g-3">
                                <div class="col-6">
                                    <label class="form-label">Mã phòng *</label>
                                    <input type="text" name="code" class="form-control" placeholder="P101" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Tên phòng *</label>
                                    <input type="text" name="name" class="form-control" placeholder="Phòng học 101" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Tòa nhà</label>
                                    <input type="text" name="building" class="form-control" placeholder="Tòa A">
                                </div>
                                <div class="col-3">
                                    <label class="form-label">Tầng</label>
                                    <input type="number" name="floor" class="form-control" placeholder="1">
                                </div>
                                <div class="col-3">
                                    <label class="form-label">Sức chứa</label>
                                    <input type="number" name="capacity" class="form-control" placeholder="40">
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i> Thêm phòng
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</html>
