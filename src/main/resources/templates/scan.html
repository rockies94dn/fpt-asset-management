<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${asset.name + ' - FPT Asset'}">Thông tin thiết bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #FF6B00; }
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; min-height: 100vh; }
        .hero { background: linear-gradient(135deg, #FF6B00, #E05A00); color: white; padding: 28px 20px 60px; }
        .card-pull { margin: -36px 16px 0; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
        .status-pill { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px; }
        .available { background: rgba(16,185,129,0.12); color: #10B981; }
        .in_use    { background: rgba(59,130,246,0.12);  color: #3B82F6; }
        .broken    { background: rgba(239,68,68,0.12);   color: #EF4444; }
        .maintenance { background: rgba(245,158,11,0.12); color: #F59E0B; }
        .info-row { display: flex; justify-content: space-between; padding: 11px 0;
            border-bottom: 1px solid #f3f4f6; font-size: 14px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #9ca3af; font-weight: 500; }
        .info-value { font-weight: 600; color: #1f2937; text-align: right; }
    </style>
</head>
<body>
<!-- Hero -->
<div class="hero">
    <div class="d-flex align-items-center gap-3 mb-2">
        <div style="width:48px;height:48px;background:rgba(255,255,255,0.2);border-radius:12px;
                 display:flex;align-items:center;justify-content:center;font-size:24px;">
            <i th:class="'bi ' + ${asset.category != null ? asset.category.icon : 'bi-box'}"></i>
        </div>
        <div>
            <div style="font-size:12px;opacity:0.8;">FPT Polytechnic Đà Nẵng</div>
            <div style="font-size:18px;font-weight:700;" th:text="${asset.name}">Thiết bị</div>
        </div>
    </div>
    <div style="font-size:13px;opacity:0.7;">
        <i class="bi bi-upc me-1"></i>
        <span th:text="${asset.qaCode}"></span>
    </div>
</div>

<!-- Info Card -->
<div class="card-pull bg-white p-4 mb-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <span style="font-weight:700;font-size:16px;">Trạng thái</span>
        <span th:class="'status-pill ' + ${asset.status.name().toLowerCase()}">
                <i class="bi bi-circle-fill" style="font-size:8px;"></i>
                <span th:text="${asset.status.displayName}"></span>
            </span>
    </div>

    <div class="info-row">
        <span class="info-label">Loại thiết bị</span>
        <span class="info-value" th:text="${asset.category?.name ?: 'N/A'}"></span>
    </div>
    <div class="info-row">
        <span class="info-label">Vị trí</span>
        <span class="info-value" th:text="${asset.room?.name ?: 'Chưa xác định'}"></span>
    </div>
    <div class="info-row" th:if="${asset.brand != null}">
        <span class="info-label">Thương hiệu</span>
        <span class="info-value" th:text="${asset.brand}"></span>
    </div>
    <div class="info-row" th:if="${asset.model != null}">
        <span class="info-label">Model</span>
        <span class="info-value" th:text="${asset.model}"></span>
    </div>
    <div class="info-row" th:if="${asset.warrantyExpiry != null}">
        <span class="info-label">Hết bảo hành</span>
        <span class="info-value" th:text="${#temporals.format(asset.warrantyExpiry, 'dd/MM/yyyy')}"></span>
    </div>
</div>

<!-- Actions -->
<div class="px-4">
    <div class="d-flex flex-column gap-2">
        <a th:href="@{'/usages/checkin?qaCode=' + ${asset.qaCode}}"
           th:if="${asset.status.name() == 'AVAILABLE'}"
           class="btn w-100 py-3" style="background:#FF6B00;color:white;border-radius:14px;font-weight:600;font-size:15px;">
            <i class="bi bi-box-arrow-in-right me-2"></i> Check-in thiết bị này
        </a>
        <a th:href="@{'/maintenance/report?qaCode=' + ${asset.qaCode}}"
           class="btn btn-outline-danger w-100 py-3" style="border-radius:14px;font-weight:600;font-size:15px;">
            <i class="bi bi-tools me-2"></i> Báo hỏng / Bảo trì
        </a>
    </div>
    <p class="text-center mt-3" style="font-size:12px;color:#9ca3af;">
        Cần đăng nhập để thực hiện thao tác
    </p>
</div>
</body>
</html>
