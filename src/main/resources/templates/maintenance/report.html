<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/layout :: layout(~{::title}, ~{::breadcrumb}, ~{::content}, ~{::head-extra}, ~{::scripts})}">
    <title th:fragment="title">Báo hỏng thiết bị</title>
    <th:block th:fragment="head-extra">
        <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    </th:block>
    <th:block th:fragment="breadcrumb">
        <nav aria-label="breadcrumb"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item"><a th:href="@{/templates/maintenance}">Bảo trì</a></li>
            <li class="breadcrumb-item active">Báo hỏng</li>
        </ol></nav>
    </th:block>

    <th:block th:fragment="content" th:with="currentPage='maintenance'">
        <div class="page-header">
            <div class="page-title"><i class="bi bi-exclamation-triangle"></i> Báo hỏng / Bảo trì</div>
        </div>

        <div class="row g-3 justify-content-center">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><i class="bi bi-file-earmark-text"></i> Phiếu báo hỏng</span>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/maintenance/report}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-3">
                                <label class="form-label">Mã QA thiết bị <span class="text-danger">*</span></label>
                                <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-upc" style="color:#FF6B00;"></i>
                                </span>
                                    <input type="text" name="qaCode" id="qaCodeInput" class="form-control"
                                           placeholder="Nhập hoặc quét mã QA"
                                           th:value="${qaCode}" required>
                                    <button type="button" class="btn btn-outline-secondary" onclick="toggleScanner()">
                                        <i class="bi bi-qr-code-scan"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-primary" onclick="lookupAsset()">
                                        <i class="bi bi-search"></i>
                                    </button>
                                </div>
                                <div id="qr-reader-small" class="qr-scanner-preview" style="display:none;margin-top:8px;"></div>
                            </div>

                            <!-- Asset preview -->
                            <div th:if="${asset != null}" class="mb-3 p-3 rounded-3"
                                 style="background:#FFF3E0;border:1px solid rgba(255,107,0,0.2);">
                                <div style="font-weight:600;" th:text="${asset.name}"></div>
                                <div style="font-size:12px;color:#6b7280;">
                                    <span th:text="${asset.room?.name ?: 'N/A'}"></span>
                                    &bull;
                                    <span th:text="${asset.category?.name}"></span>
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Loại yêu cầu <span class="text-danger">*</span></label>
                                    <select name="issueType" class="form-select" required>
                                        <option value="">-- Chọn loại --</option>
                                        <option value="BROKEN">🔴 Báo hỏng</option>
                                        <option value="MAINTENANCE">🟡 Bảo trì định kỳ</option>
                                        <option value="UPGRADE">🔵 Nâng cấp</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Mức độ ưu tiên</label>
                                    <select name="priority" class="form-select">
                                        <option value="LOW">⚪ Thấp</option>
                                        <option value="NORMAL" selected>🔵 Bình thường</option>
                                        <option value="HIGH">🟡 Cao</option>
                                        <option value="URGENT">🔴 Khẩn cấp</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Mô tả lỗi / yêu cầu <span class="text-danger">*</span></label>
                                    <textarea name="description" class="form-control" rows="4"
                                              placeholder="Mô tả chi tiết vấn đề, triệu chứng hỏng..." required></textarea>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-danger px-4">
                                    <i class="bi bi-send me-1"></i> Gửi báo cáo
                                </button>
                                <a th:href="@{/templates/maintenance}" class="btn btn-outline-secondary px-4">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="scripts">
        <style>
            .qr-scanner-preview {
                border-radius: 10px;
                overflow: hidden;
                background: #0f172a;
                min-height: 280px;
            }
            .qr-scanner-preview > div {
                border: none !important;
            }
            .qr-scanner-preview video,
            .qr-scanner-preview img {
                width: 100% !important;
                height: auto !important;
                max-height: none !important;
                object-fit: contain;
            }
        </style>
        <script>
            let html5QrCode = null;
            let scannerRunning = false;
            function toggleScanner() {
                const readerDiv = document.getElementById('qr-reader-small');
                if (!scannerRunning) {
                    readerDiv.style.display = 'block';
                    html5QrCode = new Html5Qrcode("qr-reader-small");
                    html5QrCode.start(
                        { facingMode: "environment" },
                        {
                            fps: 10,
                            aspectRatio: 1.333334,
                            qrbox: (viewfinderWidth, viewfinderHeight) => {
                                const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.7);
                                return { width: size, height: size };
                            }
                        },
                        (text) => {
                            let code = text;
                            const match = text.match(/\/assets\/scan\/(.+)$/);
                            if (match) code = match[1];
                            document.getElementById('qaCodeInput').value = code;
                            stopScanner();
                            lookupAsset();
                        }, () => {}
                    ).then(() => { scannerRunning = true; });
                } else { stopScanner(); }
            }
            function stopScanner() {
                if (html5QrCode && scannerRunning) {
                    html5QrCode.stop().then(() => {
                        scannerRunning = false;
                        document.getElementById('qr-reader-small').style.display = 'none';
                    });
                }
            }
            function lookupAsset() {
                const code = document.getElementById('qaCodeInput').value.trim();
                if (code) window.location.href = '/maintenance/report?qaCode=' + encodeURIComponent(code);
            }
        </script>
    </th:block>
</th:block>
</html>
