<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<th:block
        th:replace="~{fragments/layout :: layout(~{::title}, ~{::breadcrumb}, ~{::content}, ~{::head-extra}, ~{::scripts})}">
    <title th:fragment="title">Mượn / Trả thiết bị</title>
    <th:block th:fragment="head-extra"></th:block>
    <th:block th:fragment="breadcrumb">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                <li class="breadcrumb-item active">Mượn / Trả</li>
            </ol>
        </nav>
    </th:block>

    <th:block th:fragment="content" th:with="currentPage='usages'">
        <div class="page-header">
            <div class="page-title"><i class="bi bi-arrow-left-right"></i> Quản lý mượn / trả</div>
            <a th:href="@{/usages/checkin}" class="btn btn-primary">
                <i class="bi bi-qr-code-scan me-1"></i> Check-in mới
            </a>
        </div>

        <div class="search-bar">
            <form th:action="@{/usages}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <input type="text" name="keyword" class="form-control"
                               placeholder="Tên thiết bị, người dùng..."
                               th:value="${keyword}">
                    </div>
                    <div class="col-md-4">
                        <select name="status" class="form-select">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option th:each="s : ${statuses}" th:value="${s.name()}"
                                    th:text="${s.displayName}"
                                    th:selected="${s.name() == selectedStatus?.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search me-1"></i> Tìm kiếm
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-wrapper">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Thiết bị</th>
                        <th>Mã QA</th>
                        <th>Người dùng</th>
                        <th>Phòng</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u, stat : ${usages.content}">
                        <td style="color:#9ca3af;font-size:13px;" th:text="${stat.index + 1}"></td>
                        <td style="font-weight:500;font-size:14px;" th:text="${u.asset.name}"></td>
                        <td>
                            <code style="background:#FFF3E0;color:#FF6B00;padding:2px 7px;border-radius:5px;font-size:12px;"
                                  th:text="${u.asset.qaCode}"></code>
                        </td>
                        <td>
                            <div style="font-size:14px;font-weight:500;" th:text="${u.user.fullName}"></div>
                            <div style="font-size:12px;color:#9ca3af;" th:text="${u.user.username}"></div>
                        </td>
                        <td style="font-size:13px;color:#6b7280;">
                            <span th:if="${u.roomTo != null}" th:text="${u.roomTo.name}"></span>
                            <span th:unless="${u.roomTo != null}">-</span>
                        </td>
                        <td style="font-size:12px;"
                            th:text="${#temporals.format(u.checkInTime, 'dd/MM/yyyy HH:mm')}"></td>
                        <td style="font-size:12px;">
                            <span th:if="${u.checkOutTime != null}"
                                  th:text="${#temporals.format(u.checkOutTime, 'dd/MM/yyyy HH:mm')}"></span>
                            <span th:unless="${u.checkOutTime != null}" class="text-muted">--</span>
                        </td>
                        <td>
                            <span class="badge-status"
                                  th:classappend="${u.status.name() == 'ACTIVE' ? 'badge-in_use' : (u.status.name() == 'COMPLETED' ? 'badge-available' : 'badge-maintenance')}">
                                <span th:text="${u.status.displayName}"></span>
                            </span>
                        </td>
                        <td>
                            <form th:if="${u.status.name() == 'ACTIVE'}"
                                  th:action="@{/usages/{id}/checkout(id=${u.id})}" method="post"
                                  style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="note" value="Hoàn trả thiết bị">
                                <button type="submit" class="btn btn-sm btn-success"
                                        onclick="return confirm('Xác nhận trả thiết bị về Store Room?')">
                                    <i class="bi bi-box-arrow-left me-1"></i> Check-out
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${usages.isEmpty()}">
                        <td colspan="9">
                            <div class="empty-state">
                                <div class="empty-state-icon"><i class="bi bi-arrow-left-right"></i></div>
                                <div class="empty-state-text">Chưa có lịch sử mượn/trả</div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${usages.totalPages > 1}" class="d-flex justify-content-center mt-4">
            <nav>
                <ul class="pagination">
                    <li class="page-item" th:classappend="${usages.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/usages(page=${usages.number - 1})}">
                            <i class="bi bi-chevron-left"></i></a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, usages.totalPages - 1)}"
                        class="page-item" th:classappend="${i == usages.number} ? 'active'">
                        <a class="page-link" th:href="@{/usages(page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${usages.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/usages(page=${usages.number + 1})}">
                            <i class="bi bi-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </th:block>

    <th:block th:fragment="scripts"></th:block>
</th:block>
</html>
