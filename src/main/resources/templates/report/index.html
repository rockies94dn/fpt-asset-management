<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/layout :: layout(~{::title}, ~{::breadcrumb}, ~{::content}, ~{::head-extra}, ~{::scripts})}">
    <title th:fragment="title">Xuất báo cáo</title>
    <th:block th:fragment="head-extra"></th:block>
    <th:block th:fragment="breadcrumb">
        <nav aria-label="breadcrumb"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Báo cáo</li>
        </ol></nav>
    </th:block>

    <th:block th:fragment="content" th:with="currentPage='reports'">
        <div class="page-header">
            <div class="page-title"><i class="bi bi-file-earmark-bar-graph"></i> Xuất báo cáo</div>
        </div>

        <div class="row g-3 justify-content-center">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><i class="bi bi-sliders"></i> Tùy chọn xuất</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label">Lọc theo phòng (để trống = tất cả)</label>
                            <select id="roomFilter" class="form-select">
                                <option value="">-- Tất cả phòng --</option>
                                <option th:each="r : ${rooms}" th:value="${r.id}"
                                        th:text="${r.code + ' - ' + r.name}"></option>
                            </select>
                        </div>

                        <div class="row g-3">
                            <div class="col-sm-6">
                                <div class="export-card" onclick="exportReport('excel')"
                                     style="cursor:pointer;border:2px solid #e5e7eb;border-radius:14px;
                                        padding:24px;text-align:center;transition:all 0.2s;">
                                    <div style="font-size:44px;color:#10B981;margin-bottom:12px;">
                                        <i class="bi bi-file-earmark-excel"></i>
                                    </div>
                                    <div style="font-weight:700;font-size:16px;margin-bottom:4px;">Xuất Excel</div>
                                    <div style="font-size:12px;color:#6b7280;">Danh sách .xlsx đầy đủ</div>
                                    <div class="mt-3">
                                    <span class="btn btn-success btn-sm w-100">
                                        <i class="bi bi-download me-1"></i> Tải xuống Excel
                                    </span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="export-card" onclick="exportReport('pdf')"
                                     style="cursor:pointer;border:2px solid #e5e7eb;border-radius:14px;
                                        padding:24px;text-align:center;transition:all 0.2s;">
                                    <div style="font-size:44px;color:#EF4444;margin-bottom:12px;">
                                        <i class="bi bi-file-earmark-pdf"></i>
                                    </div>
                                    <div style="font-weight:700;font-size:16px;margin-bottom:4px;">Xuất PDF</div>
                                    <div style="font-size:12px;color:#6b7280;">Báo cáo in ấn</div>
                                    <div class="mt-3">
                                    <span class="btn btn-danger btn-sm w-100">
                                        <i class="bi bi-download me-1"></i> Tải xuống PDF
                                    </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="scripts">
        <style>
            .export-card:hover { border-color: #FF6B00 !important; transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        </style>
        <script>
            function exportReport(type) {
                const roomId = document.getElementById('roomFilter').value;
                let url = '/reports/export/' + type;
                if (roomId) url += '?roomId=' + roomId;
                window.location.href = url;
            }
        </script>
    </th:block>
</th:block>
</html>
