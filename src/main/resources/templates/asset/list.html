<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/layout :: layout(~{::title}, ~{::breadcrumb}, ~{::content}, ~{::head-extra}, ~{::scripts})}">

    <title th:fragment="title">Quản lý thiết bị</title>
    <th:block th:fragment="head-extra"></th:block>

    <th:block th:fragment="breadcrumb">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                <li class="breadcrumb-item active">Thiết bị</li>
            </ol>
        </nav>
    </th:block>

    <th:block th:fragment="content" th:with="currentPage='assets'">

        <div class="page-header">
            <div class="page-title"><i class="bi bi-pc-display"></i> Quản lý thiết bị</div>
            <a th:href="@{/assets/create}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Thêm thiết bị
            </a>
        </div>

        <!-- Search & Filter -->
        <div class="search-bar">
            <form th:action="@{/assets}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label mb-1">Tìm kiếm</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="keyword" class="form-control"
                                   placeholder="Tên thiết bị, mã QA..."
                                   th:value="${keyword}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1">Trạng thái</label>
                        <select name="status" class="form-select">
                            <option value="">-- Tất cả --</option>
                            <option th:each="s : ${statuses}" th:value="${s.name()}"
                                    th:text="${s.displayName}"
                                    th:selected="${s == selectedStatus}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label mb-1">Loại thiết bị</label>
                        <select name="categoryId" class="form-select">
                            <option value="">-- Tất cả loại --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}"
                                    th:text="${c.name}"
                                    th:selected="${c.id == selectedCategoryId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1">Phòng</label>
                        <select name="roomId" class="form-select">
                            <option value="">-- Tất cả --</option>
                            <option th:each="r : ${rooms}" th:value="${r.id}"
                                    th:text="${r.code + ' - ' + r.name}"
                                    th:selected="${r.id == selectedRoomId}"></option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results info -->
        <div class="d-flex justify-content-between align-items-center mb-3">
        <span style="font-size:13px;color:#6b7280;">
            Tìm thấy <strong th:text="${assets.totalElements}">0</strong> thiết bị
        </span>
            <div class="btn-group btn-group-sm" id="viewToggle">
                <button class="btn btn-outline-secondary active" id="gridBtn" onclick="setView('grid')">
                    <i class="bi bi-grid-3x3-gap"></i>
                </button>
                <button class="btn btn-outline-secondary" id="listBtn" onclick="setView('list')">
                    <i class="bi bi-list-ul"></i>
                </button>
            </div>
        </div>

        <!-- Grid View -->
        <div id="gridView">
            <div class="row g-3" th:if="${!assets.empty}">
                <div class="col-sm-6 col-md-4 col-xl-3" th:each="asset : ${assets.content}">
                    <div class="asset-card">
                        <div class="asset-card-header">
                            <div class="asset-icon">
                                <i th:class="'bi ' + (${asset.category != null ? asset.category.icon : 'bi-box'})"></i>
                            </div>
                            <span th:class="'badge-status badge-' + ${asset.status.name().toLowerCase()}">
                            <i class="bi bi-circle-fill" style="font-size:7px;"></i>
                            <span th:text="${asset.status.displayName}"></span>
                        </span>
                        </div>
                        <div class="asset-card-body">
                            <div class="asset-card-name" th:text="${asset.name}">Tên thiết bị</div>
                            <div class="asset-card-qa mt-1">
                                <i class="bi bi-upc me-1" style="color:#FF6B00;"></i>
                                <span th:text="${asset.qaCode}">FPT-001</span>
                            </div>
                            <div style="font-size:12px;color:#9ca3af;margin-top:4px;" th:if="${asset.room != null}">
                                <i class="bi bi-geo-alt me-1"></i>
                                <span th:text="${asset.room.name}"></span>
                            </div>
                        </div>
                        <div class="asset-card-footer">
                        <span style="font-size:12px;color:#9ca3af;" th:if="${asset.category != null}"
                              th:text="${asset.category.name}"></span>
                            <div class="d-flex gap-1">
                                <a th:href="@{'/assets/' + ${asset.id}}"
                                   class="btn btn-sm btn-outline-primary py-1 px-2" title="Chi tiết">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{'/assets/' + ${asset.id} + '/edit'}"
                                   class="btn btn-sm btn-outline-secondary py-1 px-2" title="Sửa">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty state -->
            <div th:if="${assets.empty}" class="table-wrapper">
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="bi bi-pc-display"></i></div>
                    <div class="empty-state-text">Không tìm thấy thiết bị nào</div>
                    <a th:href="@{/assets/create}" class="btn btn-primary mt-3">
                        <i class="bi bi-plus-circle me-1"></i> Thêm thiết bị đầu tiên
                    </a>
                </div>
            </div>
        </div>

        <!-- List View (hidden by default) -->
        <div id="listView" style="display:none;">
            <div class="table-wrapper">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Mã QA</th>
                            <th>Tên thiết bị</th>
                            <th>Loại</th>
                            <th>Phòng</th>
                            <th>Thương hiệu</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="asset : ${assets.content}">
                            <td>
                                <code style="background:#FFF3E0;color:#FF6B00;padding:3px 8px;border-radius:5px;font-size:12px;"
                                      th:text="${asset.qaCode}"></code>
                            </td>
                            <td style="font-weight:500;" th:text="${asset.name}"></td>
                            <td style="font-size:13px;" th:text="${asset.category?.name}"></td>
                            <td style="font-size:13px;color:#6b7280;" th:text="${asset.room?.name ?: '-'}"></td>
                            <td style="font-size:13px;" th:text="${asset.brand ?: '-'}"></td>
                            <td>
                                <span th:class="'badge-status badge-' + ${asset.status.name().toLowerCase()}">
                                    <span th:text="${asset.status.displayName}"></span>
                                </span>
                            </td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{'/assets/' + ${asset.id}}" class="btn btn-sm btn-outline-primary py-1 px-2">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{'/assets/' + ${asset.id} + '/edit'}" class="btn btn-sm btn-outline-secondary py-1 px-2">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{'/assets/' + ${asset.id} + '/delete'}" method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-2"
                                                onclick="return confirm('Xóa thiết bị này?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${assets.totalPages > 1}" class="d-flex justify-content-center mt-4">
            <nav>
                <ul class="pagination">
                    <li class="page-item" th:classappend="${assets.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/assets(page=${assets.number - 1},
                        keyword=${keyword}, status=${selectedStatus},
                        categoryId=${selectedCategoryId}, roomId=${selectedRoomId})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, assets.totalPages - 1)}"
                        class="page-item" th:classappend="${i == assets.number} ? 'active'">
                        <a class="page-link" th:href="@{/assets(page=${i},
                        keyword=${keyword}, status=${selectedStatus},
                        categoryId=${selectedCategoryId}, roomId=${selectedRoomId})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${assets.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/assets(page=${assets.number + 1},
                        keyword=${keyword}, status=${selectedStatus},
                        categoryId=${selectedCategoryId}, roomId=${selectedRoomId})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

    </th:block>

    <th:block th:fragment="scripts">
        <script>
            function setView(type) {
                if (type === 'grid') {
                    document.getElementById('gridView').style.display = 'block';
                    document.getElementById('listView').style.display = 'none';
                    document.getElementById('gridBtn').classList.add('active');
                    document.getElementById('listBtn').classList.remove('active');
                } else {
                    document.getElementById('gridView').style.display = 'none';
                    document.getElementById('listView').style.display = 'block';
                    document.getElementById('listBtn').classList.add('active');
                    document.getElementById('gridBtn').classList.remove('active');
                }
                localStorage.setItem('assetView', type);
            }
            // Restore saved view
            const saved = localStorage.getItem('assetView');
            if (saved) setView(saved);
        </script>
    </th:block>

</th:block>
</html>
