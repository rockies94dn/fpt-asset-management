<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - FPT Asset Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="login-wrapper">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height:100vh; padding: 24px 0;">
        <div class="col-12 col-sm-12 col-md-12 col-lg-12">
            <div class="login-card">
                <div class="login-logo">
                    <div class="login-logo-icon">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <div class="login-title">Tạo tài khoản</div>
                    <div class="login-subtitle">Đăng ký để sử dụng hệ thống</div>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2 px-3 mb-3 rounded-3" style="font-size:13px;">
                    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                </div>

                <form th:action="@{/auth/register}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label">Họ và tên</label>
                        <input type="text" name="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control" placeholder="username" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="email@fpt.edu.vn">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" name="confirmPassword" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2" style="font-size:15px;font-weight:600;">
                        <i class="bi bi-person-check me-2"></i>Đăng ký
                    </button>
                </form>

                <hr style="margin:20px 0;border-color:#f0f0f0;">
                <div class="text-center">
                    <span style="font-size:13px;color:#6b7280;">Đã có tài khoản? </span>
                    <a th:href="@{/auth/login}" style="color:#FF6B00;font-weight:600;font-size:13px;text-decoration:none;">
                        Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
