# ===== FPT Asset Management System =====
# Application
spring.application.name=FPT Asset Management
server.port=8080

# ===== MS SQL Server Configuration =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FPTAssetDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa201141
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Logging =====
logging.level.com.fpt=DEBUG
logging.level.org.springframework.security=INFO

# ===== QR Code Config =====
app.qr.size=300
app.qr.base-url=http://localhost:8080

# ===== Session =====
server.servlet.session.timeout=30m