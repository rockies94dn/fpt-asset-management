# ===== FPT Asset Management System =====
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=FPT Asset Management
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===== PostgreSQL Configuration =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fpt_asset_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Logging =====
logging.level.com.fpt=DEBUG
logging.level.org.springframework.security=INFO

# ===== QR Code Config =====
app.qr.size=300
app.qr.base-url=${APP_BASE_URL:http://localhost:8080}

# ===== Session =====
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# ===== Email Verification =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@fptasset.local}}
app.upload.ticket-root=${TICKET_UPLOAD_ROOT:uploads/tickets}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
